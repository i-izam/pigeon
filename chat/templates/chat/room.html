<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PIGEON - {{ other.username }}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e5ddd5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #075e54;
            color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header a {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
        }

        #chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 8px;
            background: #fff;
            align-self: flex-start;
            word-wrap: break-word;
        }

        .msg.me {
            background: #dcf8c6;
            align-self: flex-end;
        }

        .msg .time {
            display: block;
            font-size: 11px;
            color: #888;
            text-align: right;
            margin-top: 2px;
        }

        #empty-msg {
            align-self: center;
            color: #666;
        }

        /* PIGEON: typing indicator, message box ke upar */
        .typing {
            font-size: 13px;
            min-height: 22px;
            padding: 2px 16px 4px;
            color: #075e54;
            font-style: italic;
        }

        .input-bar {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #f0f0f0;
        }

        .input-bar input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
        }

        .input-bar button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #075e54;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="header">
        <a href="{% url 'home' %}">&larr;</a>
        <div>
            <h2>{{ other.username }}</h2>
        </div>
    </div>

    <div id="chat-log">
        {% for m in messages %}
        <div class="msg {% if m.sender == request.user %}me{% endif %}">
            {{ m.text }}
            <span class="time">{{ m.timestamp|date:"H:i" }}</span>
        </div>
        {% empty %}
        <p id="empty-msg">Abhi koi message nahi hai.</p>
        {% endfor %}
    </div>

    <div id="typing-indicator" class="typing"></div>

    <div class="input-bar">
        <input id="chat-input" type="text" placeholder="Message likho..." autofocus>
        <button id="chat-send">Send</button>
    </div>

    {{ other.username|json_script:"other-username" }}
    {{ request.user.username|json_script:"my-username" }}

    <script>
        const other = JSON.parse(document.getElementById('other-username').textContent);
        const me = JSON.parse(document.getElementById('my-username').textContent);
        const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
        const socket = new WebSocket(
            `${scheme}://${location.host}/ws/chat/${encodeURIComponent(other)}/`
        );

        const log = document.getElementById('chat-log');
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send');
        const typingEl = document.getElementById('typing-indicator');

        let typingTimeout = null;
        let isTypingSent = false;
        let hideTypingTimer = null;

        function scrollToBottom() {
            log.scrollTop = log.scrollHeight;
        }
        scrollToBottom();

        // PIGEON: typing event bhejna
        function sendTyping(state) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({type: 'typing', is_typing: state}));
            }
        }

        input.addEventListener('input', function () {
            if (!isTypingSent) {
                sendTyping(true);
                isTypingSent = true;
            }

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(function () {
                sendTyping(false);
                isTypingSent = false;
            }, 1500);
        });

        socket.onmessage = function (e) {
            const data = JSON.parse(e.data);

            // PIGEON: doosre ka typing status
            if (data.type === 'typing') {
                typingEl.textContent = data.is_typing ? 'typing...' : '';

                clearTimeout(hideTypingTimer);
                if (data.is_typing) {
                    hideTypingTimer = setTimeout(function () {
                        typingEl.textContent = '';
                    }, 3000);
                }
                return;
            }

            // asli message aaya to typing hata do
            typingEl.textContent = '';

            const empty = document.getElementById('empty-msg');
            if (empty) empty.remove();

            const div = document.createElement('div');
            div.className = 'msg' + (data.sender === me ? ' me' : '');
            div.appendChild(document.createTextNode(data.message));

            const time = document.createElement('span');
            time.className = 'time';
            time.textContent = new Date().toLocaleTimeString([], {
                hour: '2-digit', minute: '2-digit', hour12: false
            });
            div.appendChild(time);

            log.appendChild(div);
            scrollToBottom();
        };

        function sendMessage() {
            const text = input.value.trim();
            if (!text || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify({message: text}));
            input.value = '';
            input.focus();

            // message bhejte hi typing band
            clearTimeout(typingTimeout);
            if (isTypingSent) {
                sendTyping(false);
                isTypingSent = false;
            }
        }

        sendBtn.onclick = sendMessage;
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>

    <script>
        const presenceScheme = location.protocol === 'https:' ? 'wss' : 'ws';
        const presenceSocket = new WebSocket(
            `${presenceScheme}://${location.host}/ws/presence/`
        );
    </script>

</body>

</html>
