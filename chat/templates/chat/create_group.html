<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PIGEON - New Group</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e5ddd5;
            min-height: 100vh;
        }

        .header {
            background: #075e54;
            color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header a {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 18px;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 16px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        label.title {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
        }

        .name-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            margin-bottom: 16px;
        }

        .member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 4px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .member:last-child {
            border-bottom: none;
        }

        .member input {
            width: 18px;
            height: 18px;
        }

        .error {
            background: #fdecea;
            color: #b3261e;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .create-btn {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 20px;
            background: #075e54;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .empty {
            color: #777;
            padding: 8px 0;
        }
    </style>
</head>

<body>
    <div class="header">
        <a href="{% url 'home' %}">&larr;</a>
        <h2>New Group</h2>
    </div>

    <div class="container">
        <form method="post" class="card">
            {% csrf_token %}

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <label class="title" for="group-name">Group ka naam</label>
            <input id="group-name" class="name-input" type="text" name="name" maxlength="60"
                placeholder="Jaise: Friends, Family..." autocomplete="off">

            <label class="title">Members chuno</label>

            {% for u in users %}
            <label class="member">
                <input type="checkbox" name="members" value="{{ u.id }}">
                <span>{{ u.username }}</span>
            </label>
            {% empty %}
            <div class="empty">Abhi koi aur user nahi hai.</div>
            {% endfor %}

            <button type="submit" class="create-btn">Create Group</button>
        </form>
    </div>
</body>

</html>
