<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIGEON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #0b8f7a;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }

        .center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.8s ease forwards;
        }

        .logo {
            font-size: 90px;
            animation: pulse 1.6s ease-in-out infinite;
        }

        .title {
            margin-top: 12px;
            font-size: 34px;
            font-weight: 600;
            letter-spacing: 6px;
        }

        .footer {
            padding-bottom: 40px;
            text-align: center;
            animation: fadeIn 1.2s ease forwards;
        }

        .footer small {
            display: block;
            font-size: 13px;
            opacity: 0.8;
        }

        .footer strong {
            font-size: 18px;
            letter-spacing: 2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }
    </style>
</head>

<body>

    <div class="center">
        <div class="logo">🕊️</div>
        <div class="title">PIGEON</div>
    </div>

    <div class="footer">
        <small>from</small>
        <strong>MOHAMMED IZAM</strong>
    </div>

    <script>
        setTimeout(function () {
            window.location.href = "/";
        }, 3000);
    </script>

</body>

</html>
