<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if (!sessionStorage.getItem('pigeonSplash')) {
            sessionStorage.setItem('pigeonSplash', '1');
            window.location.replace('/welcome/');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PIGEON</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e5ddd5;
            min-height: 100vh;
        }

        .header {
            background: #075e54;
            color: #fff;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header .brand {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header .me {
            font-size: 14px;
            margin-right: 12px;
            opacity: 0.9;
        }

        .header form {
            display: inline;
        }

        .header button {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
        }

        .header button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 16px;
        }

        .search {
            width: 100%;
            padding: 10px 16px;
            font-size: 15px;
            border: none;
            border-radius: 20px;
            outline: none;
            margin-bottom: 12px;
        }

        .list {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        }

        .user {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            text-decoration: none;
            color: #222;
            border-bottom: 1px solid #f0f0f0;
        }

        .user:last-child {
            border-bottom: none;
        }

        .user:hover {
            background: #f5f5f5;
        }

        .avatar {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #25d366;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* PIGEON: online / offline dot on avatar */
        .presence-dot {
            position: absolute;
            right: -1px;
            bottom: -1px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #b0b0b0;
            border: 2px solid #fff;
        }

        .presence-dot.online {
            background: #25d366;
        }

        .name {
            font-size: 16px;
            flex: 1;
        }

        .badge {
            background: #25d366;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty {
            padding: 24px 16px;
            text-align: center;
            color: #777;
        }

        #no-match {
            display: none;
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="brand">PIGEON</span>
        <div>
            <span class="me">{{ request.user.username }}</span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>

    <div class="container">
        <input id="search" class="search" type="text" placeholder="Search users..." autocomplete="off">

        <div class="list" id="user-list">
            {% for u in users %}
            <a class="user" href="{% url 'chat_room' u.username %}" data-name="{{ u.username|lower }}"
                data-user-id="{{ u.id }}">

                <div class="avatar">
                    {{ u.username|first|upper }}
                    <span class="presence-dot"></span>
                </div>

                <span class="name">{{ u.username }}</span>

                {% if u.unread %}
                <span class="badge">{{ u.unread }}</span>
                {% endif %}
            </a>
            {% empty %}
            <div class="empty">Abhi koi aur user nahi hai.</div>
            {% endfor %}

            <div class="empty" id="no-match">Koi user nahi mila.</div>
        </div>
    </div>

    <script>
        // Existing user search functionality

        const search = document.getElementById('search');
        const items = document.querySelectorAll('.user');
        const noMatch = document.getElementById('no-match');

        search.addEventListener('input', function () {
            const q = search.value.trim().toLowerCase();
            let visible = 0;

            items.forEach(function (el) {
                const show = el.dataset.name.includes(q);
                el.style.display = show ? 'flex' : 'none';

                if (show) visible++;
            });

            noMatch.style.display =
                (items.length > 0 && visible === 0) ? 'block' : 'none';
        });
